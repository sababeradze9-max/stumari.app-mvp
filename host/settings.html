<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — Stumari Host</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/host.css" />
</head>
<body>

  <div class="host-layout">
    
    <!-- Sidebar -->
    <aside class="host-sidebar">
      <div>
        <div class="sidebar-header">
          <a href="../index.html" class="brand brand-dark">
            <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span>Stumari</span>
          </a>
        </div>

        <nav class="sidebar-nav">
          <a href="./dashboard.html" class="sidebar-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
            <span>Dashboard</span>
          </a>
          <a href="./properties.html" class="sidebar-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Properties</span>
          </a>
          <a href="./guide.html" class="sidebar-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>
            <span>Guide Builder</span>
          </a>
          <a href="./qr-nfc.html" class="sidebar-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 7h.01"/><path d="M17 7h.01"/><path d="M7 17h.01"/><path d="M17 17h.01"/></svg>
            <span>QR & NFC</span>
          </a>
          <a href="./settings.html" class="sidebar-link active">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>Settings</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-footer">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Saba" class="user-avatar" />
        <div class="user-info">
          <div class="user-name">Saba Beradze</div>
          <div class="user-role">Host & Superhost</div>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <div class="host-main">
      <header class="host-header">
        <h2 style="font-size: 1.25rem; font-weight: 800;">Property Settings</h2>
        <button class="btn btn-primary btn-sm" onclick="Stumari.showToast('Settings saved successfully')">Save Settings</button>
      </header>

      <main class="host-content">
        <div class="card" style="max-width: 680px; margin: 0 auto;">
          <h3 style="font-size: 1.25rem; font-weight: 800; margin-bottom: var(--space-6);">Basic Property Settings</h3>

          <div class="form-group">
            <label class="form-label">Property Name</label>
            <input type="text" class="form-control" value="Old Tbilisi Apartment" />
          </div>

          <div class="form-group">
            <label class="form-label">Address</label>
            <input type="text" class="form-control" value="14 Lado Asatiani Street, Apt 3, Tbilisi, Georgia" />
          </div>

          <div class="form-group">
            <label class="form-label">Property Type</label>
            <select class="form-control">
              <option value="apartment" selected>Apartment</option>
              <option value="guesthouse">Guesthouse</option>
              <option value="hotel">Boutique Hotel</option>
              <option value="villa">Villa</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Cover Image URL</label>
            <input type="text" class="form-control" value="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=1200&q=80" />
          </div>

          <div class="form-group">
            <label class="form-label">Guest URL Slug</label>
            <input type="text" class="form-control" value="old-tbilisi-apartment" />
            <span class="form-hint">stumari.app/g/old-tbilisi-apartment</span>
          </div>

          <div class="form-group" style="margin-top: var(--space-6); padding-top: var(--space-4); border-top: 1px solid var(--border);">
            <label class="form-label">Publish Status</label>
            <div style="display: flex; align-items: center; gap: var(--space-3); margin-top: 4px;">
              <span class="badge badge-published">Published</span>
              <span style="font-size: 0.85rem; color: var(--text-secondary);">Your guide is live and accessible to guests.</span>
            </div>
          </div>

          <div style="display: flex; justify-content: flex-end; margin-top: var(--space-8);">
            <button class="btn btn-primary" onclick="Stumari.showToast('Settings saved successfully!')">Save changes</button>
          </div>
        </div>
      </main>
    </div>

  </div>

  <script src="../js/global.js"></script>
  <script src="../js/host.js"></script>
</body>
</html>
