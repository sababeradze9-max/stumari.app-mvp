<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>window.location.replace('/#/app');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Host Dashboard — Stumari</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/host.css" />
</head>
<body>

  <div class="host-layout">
    
    <!-- Sidebar (Matches Screenshot #7) -->
    <aside class="host-sidebar">
      <div>
        <div class="sidebar-header">
          <a href="../index.html" class="brand brand-dark">
            <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span>Stumari</span>
          </a>
        </div>

        <nav class="sidebar-nav">
          <a href="./dashboard.html" class="sidebar-link active">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
            <span>Dashboard</span>
          </a>
          <a href="./properties.html" class="sidebar-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Properties</span>
          </a>
          <a href="./guide.html" class="sidebar-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10"/><path d="M6 10h10"/></svg>
            <span>Guide Builder</span>
          </a>
          <a href="./qr-nfc.html" class="sidebar-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 7h.01"/><path d="M17 7h.01"/><path d="M7 17h.01"/><path d="M17 17h.01"/></svg>
            <span>QR & NFC</span>
          </a>
          <a href="./settings.html" class="sidebar-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>Settings</span>
          </a>
        </nav>
      </div>

      <div class="sidebar-footer">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Saba" class="user-avatar" />
        <div class="user-info">
          <div class="user-name">Saba Beradze</div>
          <div class="user-role">Host & Superhost</div>
        </div>
      </div>
    </aside>

    <!-- Main Content Area (Matches Screenshot #7) -->
    <div class="host-main">
      
      <!-- Top Header -->
      <header class="host-header">
        <div class="property-selector" onclick="window.location.href='./properties.html'">
          <span>🏢</span>
          <span>Old Tbilisi Apartment</span>
          <span style="font-size: 10px; color: var(--text-muted);">&blacktriangledown;</span>
        </div>

        <div style="display: flex; align-items: center; gap: var(--space-3);">
          <a href="../guest/guide.html?slug=old-tbilisi-apartment" target="_blank" class="btn btn-secondary btn-sm">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>
            <span>Live Guest View</span>
          </a>
          <a href="../onboarding.html" class="btn btn-primary btn-sm">+ New Property</a>
        </div>
      </header>

      <main class="host-content">
        
        <!-- Welcome Greeting -->
        <div style="margin-bottom: var(--space-8);">
          <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--text-main);">Good morning, Saba 👋</h1>
          <p style="font-size: 0.95rem; color: var(--text-secondary); margin-top: 4px;">Here's what's happening with your properties.</p>
        </div>

        <!-- 3 KPI Cards (Screenshot #7) -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon stat-icon-green">🏢</div>
            <div class="stat-info">
              <div class="stat-num" id="stat-total-properties">3</div>
              <div class="stat-label">Properties</div>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon stat-icon-green">✅</div>
            <div class="stat-info">
              <div class="stat-num" id="stat-published-properties">2</div>
              <div class="stat-label">Published</div>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon stat-icon-amber">📝</div>
            <div class="stat-info">
              <div class="stat-num" id="stat-draft-properties">1</div>
              <div class="stat-label">Draft</div>
            </div>
          </div>
        </div>

        <!-- Property List Section (Screenshot #7) -->
        <div class="property-list-header">
          <h2 style="font-size: 1.25rem; font-weight: 800; color: var(--text-main);">Your Properties</h2>
          <a href="../onboarding.html" class="btn btn-primary btn-sm">+ Add Property</a>
        </div>

        <div class="property-list" id="host-property-list">
          <!-- Populated dynamically via js/host.js -->
        </div>

      </main>
    </div>

  </div>

  <script src="../js/global.js"></script>
  <script src="../js/host.js"></script>
</body>
</html>
