<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>window.location.replace('/#/admin');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Stumari Admin</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>

  <div class="admin-layout">
    
    <!-- Admin Sidebar (Screenshot #12) -->
    <aside class="admin-sidebar">
      <div>
        <div style="padding-bottom: var(--space-6); border-bottom: 1px solid #1e293b;">
          <a href="../index.html" class="brand brand-dark">
            <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Stumari Admin</span>
          </a>
        </div>

        <nav style="display: flex; flex-direction: column; gap: 4px; margin-top: var(--space-6);">
          <a href="./dashboard.html" class="sidebar-link active">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
            <span>Dashboard</span>
          </a>
          <a href="./hosts.html" class="sidebar-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span>Hosts</span>
          </a>
          <a href="./properties.html" class="sidebar-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Properties</span>
          </a>
          <a href="#support" class="sidebar-link" onclick="Stumari.showToast('Support tickets queue is clear')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>Support</span>
          </a>
          <a href="../host/dashboard.html" class="sidebar-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>Host App</span>
          </a>
        </nav>
      </div>

      <div style="font-size: 0.75rem; color: #64748b; font-family: monospace;">
        Stumari Platform v1.2
      </div>
    </aside>

    <!-- Main Content (Matches Screenshot #12) -->
    <div class="admin-main">
      <header class="admin-header">
        <h2 style="font-size: 1.25rem; font-weight: 800;">Dashboard</h2>
        <span class="badge" style="background:#0f172a; color:#ffffff; font-family:monospace; padding:4px 8px;">ADMINISTRATOR</span>
      </header>

      <main class="admin-content">
        
        <!-- 4 Metric KPI Cards (Matches Screenshot #12) -->
        <div class="admin-stats-grid">
          <div class="admin-stat-card">
            <div class="stat-label">Total hosts</div>
            <div class="stat-num">27</div>
          </div>
          <div class="admin-stat-card">
            <div class="stat-label">Total properties</div>
            <div class="stat-num">43</div>
          </div>
          <div class="admin-stat-card">
            <div class="stat-label">Published guides</div>
            <div class="stat-num">39</div>
          </div>
          <div class="admin-stat-card">
            <div class="stat-label">Draft guides</div>
            <div class="stat-num">4</div>
          </div>
        </div>

        <!-- Recent Signups Table (Matches Screenshot #12) -->
        <div class="data-table-container">
          <div class="table-header">
            <h3>Recent signups</h3>
            <span style="font-size: 0.8rem; color: var(--text-muted);">Real-time registrations</span>
          </div>

          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Host</th>
                  <th>Date</th>
                  <th>Status</th>
                  <th>Properties</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="admin-signups-body">
                <!-- Rendered by js/admin.js -->
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>

  </div>

  <script src="../js/global.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
